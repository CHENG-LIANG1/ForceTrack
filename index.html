<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ForceTrack — a focused workspace for moving work forward."
    />
    <title>ForceTrack</title>
    <script>
      /* Apply persisted locale and theme before React mounts to avoid a visible theme flash. */
      (() => {
        const root = document.documentElement;
        let locale = navigator.language.toLowerCase().startsWith('zh')
          ? 'zh-CN'
          : 'en-US';
        let theme = 'dark';

        try {
          const rawPreferences = localStorage.getItem(
            'forcetrack:preferences:v1',
          );
          const preferences = rawPreferences
            ? JSON.parse(rawPreferences)
            : null;

          if (
            preferences?.locale === 'zh-CN' ||
            preferences?.locale === 'en-US'
          ) {
            locale = preferences.locale;
          }
          if (preferences?.theme === 'light' || preferences?.theme === 'dark') {
            theme = preferences.theme;
          }
        } catch {
          // Invalid or unavailable storage falls back to the dark theme.
        }

        root.lang = locale;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
